# Reverse proxy da API do Diesel S-10.
#
# NAO edite o server_name aqui: quem preenche e o instalador, com o dominio
# que voce passar na linha de comando.
#
#   sudo ./deploy/instalar_api.sh atlas.creditfy.com.br https://meufront.vercel.app
#
# Este arquivo tem so a porta 80. O bloco HTTPS quem escreve e o certbot
# (o instalador chama), com os caminhos de certificado coerentes com o que
# ele emitiu. Escrever isso a mao so gera caminho errado.

server {
    listen 80;
    listen [::]:80;
    server_name atlas.creditfy.com.br;

    # JSON comprime muito bem: historico.json passa de ~48KB para poucos KB.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # A API nao tem escrita nem upload; corpo grande so pode ser abuso.
    client_max_body_size 8k;

    access_log /var/log/nginx/diesel-api.access.log;
    error_log  /var/log/nginx/diesel-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
