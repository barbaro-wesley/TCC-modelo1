# Reverse proxy da API do Diesel S-10.
#
# Troque SEUDOMINIO pelo dominio real ANTES de aplicar:
#   sudo sed -i 's/api.SEUDOMINIO.com.br/api.seudominio.com.br/g' /etc/nginx/sites-available/diesel-api
#
# Este arquivo e so a porta 80. O bloco HTTPS quem escreve e o certbot:
#   sudo certbot --nginx -d api.seudominio.com.br
# Ele injeta o listen 443, os caminhos do certificado e o redirect de 80 -> 443,
# sempre coerentes com o que emitiu. Escrever isso a mao so gera caminho errado.

server {
    listen 80;
    listen [::]:80;
    server_name api.SEUDOMINIO.com.br;

    # JSON comprime muito bem: historico.json passa de ~48KB para poucos KB.
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # A API nao tem escrita nem upload; corpo grande so pode ser abuso.
    client_max_body_size 8k;

    access_log /var/log/nginx/diesel-api.access.log;
    error_log  /var/log/nginx/diesel-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
