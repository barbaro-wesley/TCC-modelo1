name: Backend Python
on:
  push:
    paths: ["api/**", "forecast_store/**", "training/**", "src/**", "scripts/**", "tests/**", "deploy/**", "compose.yaml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["api/**", "forecast_store/**", "training/**", "src/**", "scripts/**", "tests/**", "deploy/**", "compose.yaml", ".github/workflows/backend.yml"]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: s10
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: s10_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U s10 -d s10_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      S10_TEST_DATABASE_URL: postgresql://s10:test-only@localhost:5432/s10_test
      S10_TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r api/requirements-dev.txt
      - run: ruff check --config api/ruff.toml api forecast_store training && ruff format --check --config api/ruff.toml api forecast_store training
      - run: pytest -c api/pytest.ini api/tests -q
      - run: bash -n deploy/instalar_api.sh
      - run: bash -n deploy/instalar_vps.sh deploy/run_semanal.sh
  scientific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Synthetic tests instrument ML estimators; torch/GBM training is not run.
      - run: pip install numpy==2.5.0 pandas==3.0.5 scipy==1.16.3 scikit-learn==1.9.0 statsmodels==0.14.6 matplotlib==3.11.1 requests==2.32.5 filelock==3.18.0 pytest==9.1.1
      - run: PYTHONPATH=.:src pytest tests -q
