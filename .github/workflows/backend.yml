name: Backend Python
on:
  push:
    paths: ["api/**", "deploy/**", "compose.yaml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["api/**", "deploy/**", "compose.yaml", ".github/workflows/backend.yml"]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: s10
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: s10_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U s10 -d s10_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      S10_TEST_DATABASE_URL: postgresql://s10:test-only@localhost:5432/s10_test
      S10_TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r api/requirements-dev.txt
      - run: ruff check api && ruff format --check api
      - run: pytest -c api/pytest.ini api/tests -q
      - run: bash -n deploy/instalar_api.sh
